<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Subscription Mail</title>
        <style type="text/css">
            * {
                box-sizing: border-box;
            }

            body,
            html {
                height: 100%;
                font-family: Arial, Helvetica, sans-serif;
                font-size: medium;
                color: #00263B;
                margin: 5px;
            }

            p {
                display: block;
                margin-block-start: 5px;
                margin-block-end: 5px;
                margin-inline-start: 0px;
                margin-inline-end: 0px;
            }

            #signature {
                margin: 0;
                padding: 0;
                font-family: Arial, Helvetica, sans-serif;
                font-size: medium;
            }

            #signature p {
                margin-top: 2px;
                margin-bottom: 2px;
                margin-left: 0px;
                margin-right: 0px;
            }

            #signature table {
                width: 100%;
            }

            #signature table,
            #signature table th,
            #signature table td {
                padding: 0;
                padding-right: 20px;
            }
        </style>
    </head>

    <body>
        <br />
        <p style="padding-left: 50px;">Dear John Doo,</p>
        <br />
        <p>We have well received your subscription request.</p>
        <p>Thank you for having fill the subscription form, we will come back to you very soon by email or by phone.</p>
        <br />
        <p>Best Regards,</p>
        <br />
        <div id="signature">
            <table aria-label="siganture" role="presentation">
                <tr>
                    <td style="width: 128px;">
                        <img src="cid:logo.jpg" alt="Logo" />
                    </td>
                    <td>
                        <strong>Logo</strong><br>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
